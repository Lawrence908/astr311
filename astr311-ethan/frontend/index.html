<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>N-Body Gravity Simulator</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #000;
            color: #ccc;
            font-family: 'Segoe UI', Arial, sans-serif;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
        }
        canvas { display: block; position: absolute; top: 0; left: 0; }
        #labelsContainer {
            position: absolute; top: 0; left: 0;
            width: 100%; height: 100%;
            pointer-events: none; z-index: 5;
        }

        /* Top nav */
        #topBar {
            position: fixed; top: 0; right: 0;
            display: flex; align-items: stretch;
            z-index: 100;
            background: rgba(15,15,20,0.85);
            border-bottom-left-radius: 4px;
        }
        .nav-btn {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            padding: 8px 18px; color: #999; background: none; border: none;
            cursor: pointer; font-size: 11px; border-bottom: 2px solid transparent; gap: 3px;
        }
        .nav-btn:hover { color: #ddd; }
        .nav-btn.active { color: #fff; border-bottom-color: #6ac; }
        .nav-btn .icon { font-size: 18px; }

        /* Side panel */
        #sidePanel {
            position: fixed; top: 50px; right: 0; width: 320px;
            max-height: calc(100vh - 90px);
            background: rgba(18,18,24,0.95);
            border-left: 1px solid #333; z-index: 90;
            overflow-y: auto; display: none;
        }
        #sidePanel.open { display: block; }
        .panel-header { display: flex; justify-content: space-between; align-items: center; padding: 14px 16px 10px; }
        .panel-header h2 { font-size: 16px; font-weight: 600; color: #fff; }
        .close-btn { background: none; border: none; color: #777; font-size: 20px; cursor: pointer; padding: 2px 6px; }
        .close-btn:hover { color: #fff; }

        .panel-tabs { display: flex; border-top: 1px solid #333; border-bottom: 1px solid #333; }
        .panel-tab {
            flex: 1; padding: 10px 8px; text-align: center;
            background: none; border: none; color: #888;
            cursor: pointer; font-size: 13px; border-bottom: 2px solid transparent;
        }
        .panel-tab:hover { color: #ccc; }
        .panel-tab.active { color: #fff; border-bottom-color: #6ac; }

        .tab-content { display: none; padding: 16px; }
        .tab-content.active { display: block; }

        .setting-group { margin-bottom: 16px; }
        .setting-label {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 6px; font-size: 13px; color: #aaa;
        }
        .help-btn {
            background: none; border: 1px solid #555; color: #888;
            font-size: 10px; padding: 1px 5px; cursor: pointer; border-radius: 2px;
        }
        .setting-select {
            width: 100%; padding: 7px 10px; background: #1a1a22;
            color: #ccc; border: 1px solid #444; border-radius: 3px; font-size: 13px;
        }
        .setting-select:focus { border-color: #6ac; outline: none; }

        .checkbox-row {
            display: flex; align-items: center; gap: 8px;
            font-size: 13px; color: #bbb; margin-bottom: 8px;
        }
        .checkbox-row input[type="checkbox"] { accent-color: #6ac; }

        /* Initial conditions editor */
        .ic-body { margin-bottom: 12px; padding: 10px; background: #1a1a22; border-radius: 4px; border-left: 3px solid #666; }
        .ic-body h4 { font-size: 12px; margin-bottom: 6px; }
        .ic-row { display: flex; gap: 6px; margin-bottom: 4px; align-items: center; }
        .ic-row label { font-size: 11px; color: #888; min-width: 28px; }
        .ic-row input {
            flex: 1; padding: 4px 6px; background: #111; color: #ddd;
            border: 1px solid #444; border-radius: 3px; font-size: 12px;
            font-family: monospace;
        }
        .ic-row input:focus { border-color: #6ac; outline: none; }
        .ic-buttons { display: flex; gap: 8px; margin-top: 12px; }
        .ic-help {
            margin-top: 6px;
            font-size: 11px;
            color: #7f8295;
            line-height: 1.35;
        }
        .runtime-presets { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
        .preset-btn {
            border: 1px solid #445;
            background: #1a1a22;
            color: #b8c8ff;
            border-radius: 4px;
            padding: 4px 8px;
            font-size: 11px;
            cursor: pointer;
        }
        .preset-btn:hover { border-color: #6ac; color: #d8e5ff; }
        .runtime-meta { color: #8c8fa6; font-size: 11px; margin-top: 4px; }
        .ic-btn {
            flex: 1; padding: 8px; border: none; border-radius: 4px;
            cursor: pointer; font-size: 12px; font-weight: 600;
        }
        .ic-btn.run { background: #2a7; color: #fff; }
        .ic-btn.run:hover { background: #3b8; }
        .ic-btn.randomize { background: #558; color: #ccc; }
        .ic-btn.randomize:hover { background: #669; }

        /* Bottom playback bar */
        #playbackBar {
            position: fixed; bottom: 0; left: 0; right: 0; height: 38px;
            display: flex; align-items: center; padding: 0 12px;
            background: rgba(15,15,20,0.9); border-top: 1px solid #2a2a2a;
            z-index: 100; gap: 8px;
        }
        .pb-btn { background: none; border: none; color: #aaa; font-size: 16px; cursor: pointer; padding: 2px 6px; }
        .pb-btn:hover { color: #fff; }
        #timeSlider {
            flex: 1; appearance: none; -webkit-appearance: none; height: 3px;
            background: #444; border-radius: 2px; outline: none;
        }
        #timeSlider::-webkit-slider-thumb {
            -webkit-appearance: none; width: 10px; height: 10px;
            background: #6ac; border-radius: 50%; cursor: pointer;
        }
        #timeDisplay { font-size: 11px; color: #888; min-width: 70px; text-align: right; }
        .speed-control { display: flex; align-items: center; gap: 4px; }
        .speed-control label { font-size: 11px; color: #777; }
        .speed-control input[type="range"] {
            width: 60px; appearance: none; -webkit-appearance: none; height: 2px; background: #444; outline: none;
        }
        .speed-control input::-webkit-slider-thumb {
            -webkit-appearance: none; width: 8px; height: 8px;
            background: #999; border-radius: 50%; cursor: pointer;
        }
        .speed-control span { font-size: 11px; color: #888; min-width: 22px; }

        /* Body labels */
        .body-label {
            position: absolute; font-size: 11px; white-space: nowrap;
            pointer-events: none; padding: 1px 5px;
            border: 1px solid rgba(255,255,255,0.25);
            background: rgba(0,0,0,0.55); border-radius: 2px;
        }
        #loading {
            position: fixed; top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            font-size: 14px; color: #888; z-index: 200;
        }
        #viewHint {
            position: fixed; bottom: 48px; left: 50%; transform: translateX(-50%);
            background: rgba(0,0,0,0.55); color: #777; font-size: 12px;
            padding: 5px 16px; border-radius: 12px; pointer-events: none;
            transition: opacity 1.5s; z-index: 200; white-space: nowrap;
        }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
</head>
<body>
    <canvas id="simCanvas"></canvas>
    <div id="labelsContainer"></div>
    <div id="loading">Loading simulation...</div>
    <div id="viewHint">Drag to rotate &nbsp;·&nbsp; Scroll to zoom &nbsp;·&nbsp; Right-click to pan</div>

    <div id="topBar">
        <button class="nav-btn active" data-panel="graphics">
            <span class="icon">&#x270F;</span>Graphics
        </button>
        <button class="nav-btn" data-panel="physics">
            <span class="icon">&#x1F310;</span>Physics
        </button>
        <button class="nav-btn" data-panel="masses">
            <span class="icon">&#x2696;</span>Masses
        </button>
    </div>

    <div id="sidePanel" class="open">
        <div class="panel-header">
            <h2 id="panelTitle">Graphics</h2>
            <button class="close-btn" id="closePanelBtn">&#x2716;</button>
        </div>
        <div class="panel-tabs" id="panelTabs">
            <button class="panel-tab active" data-tab="camera">Camera</button>
            <button class="panel-tab" data-tab="objects">Objects</button>
            <button class="panel-tab" data-tab="initial" id="icTabBtn">Run Setup</button>
        </div>

        <!-- Camera tab -->
        <div id="cameraTab" class="tab-content active">
            <div class="setting-group">
                <div class="setting-label"><span>Camera Focus</span><button class="help-btn">[?]</button></div>
                <select class="setting-select" id="cameraFocus">
                    <option value="barycenter">Barycenter</option>
                </select>
            </div>
            <div class="setting-group">
                <label class="checkbox-row">
                    <input type="checkbox" id="showLabelsCheck" checked>
                    Show Body Names
                </label>
                <label class="checkbox-row">
                    <input type="checkbox" id="showTrailsCheck" checked>
                    Show Orbital Trails
                </label>
                <label class="checkbox-row">
                    <input type="checkbox" id="showCOMCheck" checked>
                    Show Center of Mass
                </label>
                <label class="checkbox-row" id="showSunRow">
                    <input type="checkbox" id="showSunCheck" checked>
                    Enable Distant Sun
                </label>
            </div>
        </div>

        <!-- Objects tab -->
        <div id="objectsTab" class="tab-content">
            <div id="objectsList"></div>
        </div>

        <!-- Run setup tab (runtime + optional initial conditions) -->
        <div id="initialTab" class="tab-content">
            <div class="ic-row" style="margin-top: 2px;">
                <label for="runDurationInput" style="min-width:118px;">Run Time (seconds)</label>
                <input type="number" id="runDurationInput" min="0.001" step="0.1" value="6.0">
            </div>
            <div id="runSummary" class="runtime-meta"></div>
            <div class="ic-help">
                Runtime controls how long the physics is simulated before playback ends.
                <a href="#" id="toggleAdvancedSteps" style="color:#6ac; text-decoration: underline; margin-left: 6px;">Advanced: show steps</a>
            </div>
            <div class="ic-row" id="advancedStepsRow" style="display:none; margin-top:6px;">
                <label for="runStepsInput" style="min-width:44px;">Steps</label>
                <input type="number" id="runStepsInput" min="1" step="1" value="12000">
            </div>
            <div id="runtimePresets" class="runtime-presets"></div>

            <div id="icEditorSection" style="margin-top:10px;">
                <div id="icEditor"></div>
            </div>
            <div class="ic-buttons" style="margin-top: 10px;">
                <button class="ic-btn randomize" id="randomizeBtn">Randomize</button>
                <button class="ic-btn run" id="runBtn">Run Simulation</button>
            </div>
        </div>
    </div>

    <div id="playbackBar">
        <button class="pb-btn" id="playPauseBtn">&#9654;</button>
        <button class="pb-btn" id="resetBtn">&#x21BA;</button>
        <input type="range" id="timeSlider" min="0" max="100" value="0">
        <span id="timeDisplay">t = 0.00</span>
        <div class="speed-control">
            <label>Speed:</label>
            <input type="range" id="speedSlider" min="1" max="30" value="5">
            <span id="speedValue">5x</span>
        </div>
    </div>

    <script src="/frontend/sim-renderer.js"></script>
</body>
</html>
